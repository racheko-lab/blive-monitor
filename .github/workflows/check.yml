name: 直播状态检测

on:
  # 注意：GitHub Actions schedule 不太稳定，可能延迟或跳过
  # 建议配合外部 cron 服务（如 cron-job.org）使用，通过 workflow_dispatch 触发
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      force_post_check:
        description: "强制运行新作品检测（跳过15分钟窗口闸门）"
        required: false
        default: false
        type: boolean
  push:
    paths:
      - rooms.json
      - post_rooms.json

# 串行执行，避免并发 run 互相覆盖状态 / 提交冲突导致重复推送
concurrency:
  group: live-check
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write
  actions: write

jobs:
  check:
    # Runner 选择：通过仓库变量 RUNNER_LABEL 控制（Settings → Secrets and variables → Actions → Variables）。
    # - 不设置（默认）：macos-latest（GitHub 托管，快手云 IP 被封时自动降级到中国 CDN）
    # - 设为 "self-hosted"：自托管 runner（用户电脑/服务器，住宅 IP 直连快手，拿全量数据）
    # - 设为 "self-hosted,linux"：指定 Linux 自托管 runner
    runs-on: ${{ vars.RUNNER_LABEL || 'macos-latest' }}
    timeout-minutes: 30
    # 作品监控总开关：设为 "true" 启用；列表（post_rooms.json）为空时整段跳过，不浪费资源
    env:
      ENABLE_POST_CHECK: "true"
      # 快手降频：直播状态每 30 分钟实际请求一次，其余 run 沿用上次状态
      KUAISHOU_LIVE_INTERVAL_MIN: "30"
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 计算本次运行的「15 分钟窗口」分钟，仅取一次，供「新作品检测」与「封面转存」共用。
      # 关键：新作品检测含 13 个账号的无头浏览器抓取，耗时约 4~5 分钟，若两步骤各自实时取
      # UTC 分钟，「封面转存」会跨到下一个非 15 倍数分钟而被闸门跳过（实测长期漏跑）。
      # 共用同一 WIN_MIN 可保证二者在同一窗口内同时触发。放在最前，避免被前置步骤耗时拖到下一分钟。
      - name: Compute 15-min window
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 用 workflow run 的创建时间（而非当前步骤时间）计算窗口，
          # 避免 macOS runner 启动慢 5-6 分钟导致跨过 15 分钟边界。
          CREATED_AT=$(curl -sS -H "Authorization: Bearer $GITHUB_TOKEN" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            | python3 -c "import sys,json;print(json.load(sys.stdin)['created_at'])")
          echo "Run created at: $CREATED_AT"
          WINDOW=$(python3 -c "
          from datetime import datetime
          import sys
          t = datetime.fromisoformat(sys.argv[1].replace('Z','+00:00'))
          # 快手作品检查降频：每 4 小时一次（UTC 0/4/8/12/16/20 点的 0-8 分内）
          print('true' if (t.hour % 4 == 0 and t.minute <= 8) else 'false')
          " "$CREATED_AT")
          echo "IN_POST_WINDOW=$WINDOW" >> "$GITHUB_ENV"

      # 用户在前端增删账号会直接提交 post_rooms.json（push 事件）。此时不受 15 分钟闸门限制，
      # 立即抓取新账号并转存封面，免去「添加后还要等下一个 15 倍数分钟」的等待。
      # CI 自身对 post_rooms.json 的 sec_uid/昵称回写提交带 [skip ci]，不会触发本分支，故无循环。
      - name: Decide force post-check
        run: |
          # push（前端增删账号直连 Contents API 提交 post_rooms.json）与
          # workflow_dispatch（前端「立即触发一次监控」按钮 triggerMonitor()）都应绕过
          # 15 分钟闸门立即抓取；只有 schedule（每 5 分钟定时）才受闸门约束。
          # 此前仅对 push 放开，导致 triggerMonitor() 的立即触发 14/15 概率被 15 分钟窗口吞掉。
          # 同时兼容 workflow_dispatch 的 force_post_check input（默认 false，前端未传时靠
          # event_name 判定照样强制），双保险确保「立即触发」按钮一定绕过闸门。
          if [ "${{ github.event_name }}" = "push" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "${{ github.event.inputs.force_post_check }}" = "true" ]; then
            echo "FORCE_POST_CHECK=true" >> "$GITHUB_ENV"
          else
            echo "FORCE_POST_CHECK=false" >> "$GITHUB_ENV"
          fi

      # 判断作品监控列表是否非空（空则不安装/运行浏览器）
      - name: Check post_rooms list
        id: postlist
        if: ${{ env.ENABLE_POST_CHECK == 'true' }}
        run: |
          n=$(python3 -c "import json;print(len(json.load(open('post_rooms.json'))))" 2>/dev/null || echo 0)
          if [ "$n" != "0" ]; then echo "enabled=true" >> "$GITHUB_OUTPUT"; else echo "enabled=false" >> "$GITHUB_OUTPUT"; fi

      # 缓存 patchright 浏览器（抖音/快手作品监控使用，优先 patchright 隐身）
      - name: Cache Playwright browsers
        if: ${{ steps.postlist.outputs.enabled == 'true' }}
        uses: actions/cache@v4
        with:
          path: ${{ runner.os == 'macOS' && '~/Library/Caches/ms-playwright' || '~/.cache/ms-playwright' }}
          key: patchright-1.61.2-${{ runner.os }}

      # 安装 patchright + Chromium（优先 patchright 隐身抗风控；playwright 作为兜底一并安装）
      - name: Install Playwright
        if: ${{ steps.postlist.outputs.enabled == 'true' }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          if [ "$RUNNER_OS" = "Linux" ]; then
            patchright install --with-deps chromium
          else
            patchright install chromium
          fi

      # 运行直播检测
      # GITHUB_TOKEN 供 notify_dedup.sync_from_remote 在推送前拉取远端最新去重账本
      # （并发 run 兜底，防重复推送）
      - name: Run check
        env:
          BLIVE_CONFIG: ${{ secrets.BLIVE_CONFIG }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 check_status.py

      # 新作品监控（无头浏览器抓取用户主页，绕过抖音反爬；列表来自独立的 post_rooms.json）
      # 降频：每 4 小时一次（UTC 0/4/8/12/16/20 点），与开播检测解耦，
      # 降低抖音 API 限流 / 风控压力。用「分钟取模」闸门而非 schedule 判断，
      # 这样无论触发来自 GitHub 原生 schedule 还是外部 cron-job.org 的 workflow_dispatch 都生效。
      - name: Check new posts
        if: ${{ steps.postlist.outputs.enabled == 'true' }}
        env:
          BLIVE_CONFIG: ${{ secrets.BLIVE_CONFIG }}
          DOUYIN_COOKIE: ${{ secrets.DOUYIN_COOKIE }}
          KUAISHOU_COOKIE: ${{ secrets.KUAISHOU_COOKIE }}
          # 出口代理（可选）：快手按访问地域返回不同作品列表，海外 runner 会漏
          # 部分账号的最新作品（2026-08 实测 Nizi981116）。配置大陆出口代理后
          # 浏览器抓取流量走代理即可拿全。格式 http://[user:pass@]host:port。
          BROWSER_PROXY: ${{ secrets.BROWSER_PROXY }}
          ENABLE_POST_CHECK: "true"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 新作品检测降频：仅每 4 小时运行一次（UTC 0/4/8/12/16/20 点的 0-8 分内）；
          # 但若本次由 post_rooms.json 的 push 触发（用户增删账号），则立即抓取不受限。
          if [ "${FORCE_POST_CHECK}" != "true" ] && [ "${IN_POST_WINDOW}" != "true" ]; then
            echo "非新作品检测窗口（每 4 小时一次），跳过"
            exit 0
          fi
          python3 check_new_posts.py

      # D1：抖音新作封面转存（仅 post_rooms 非空时运行；差异提交避免仓库膨胀）
      # 与「新作品检测」同窗口（每 15 分钟）：无新作时不必每 5 分钟转存
      - name: Transcode covers
        if: ${{ steps.postlist.outputs.enabled == 'true' }}
        run: |
          if [ "${FORCE_POST_CHECK}" != "true" ] && [ "${IN_POST_WINDOW}" != "true" ]; then
            echo "非新作品检测窗口（每 4 小时一次），跳过封面转存"
            exit 0
          fi
          python3 transcode_covers.py --owner racheko-lab --repo blive-monitor --branch master --covers-dir assets/covers

      # A1：定时摘要自动投递（在 history.json 已更新的同轮运行；失败不影响持久化/部署）
      - name: Auto-deliver summary
        continue-on-error: true
        env:
          BLIVE_CONFIG: ${{ secrets.BLIVE_CONFIG }}
        run: python3 auto_summary.py

      # 状态持久化到 Git —— 唯一真相来源，跨 run 可靠，不再依赖易失效的 actions/cache
      - name: Persist state & keepalive
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.com"
          # 状态文件列表（DRY：避免 4 处重复拼写错误）
          STATE_FILES="state.json tracking.json history.json post_tracking.json post_rooms.json notify_dedup.json status.json summary_state.json kuaishou_guest_visitor.json"
          PERSIST_FILES="state.json tracking.json history.json post_tracking.json post_rooms.json notify_dedup.json summary_state.json kuaishou_guest_visitor.json"
          # 关键：用语义合并替代 git pull --rebase。
          # 旧方案 `git pull --rebase` 在状态文件有本地改动时会失败（远端也改了同一文件），
          # abort 后提交基于旧 base、push 非快进被拒 → 状态丢失 → 下一轮重复推送。
          # 新方案：fetch 远端（不 rebase），用 merge_state.py 按字段语义合并状态文件，
          # 然后 reset 到远端 HEAD 再覆盖合并后的文件，确保 push 快进成功。
          git fetch origin master 2>&1 || true
          python3 merge_state.py origin/master
          # 保存合并后的状态文件到临时目录（含 status.json——它由脚本每轮重写，
          # 必须随工作区最新版保留，否则 reset --hard 会回滚到远端旧版，导致前端一直
          # 显示「状态获取中」）
          TMPD=$(mktemp -d)
          for f in $STATE_FILES; do
            [ -f "$f" ] && cp "$f" "$TMPD/"
          done
          # 备份新转存的封面图（reset --hard 会回滚到远端版本，导致新封面丢失）
          [ -d assets/covers ] && cp -r assets/covers "$TMPD/covers"
          # reset 到远端 HEAD，使后续 commit 基于最新远端（确保 push 快进）
          git reset --hard origin/master 2>/dev/null || true
          # 恢复合并后的状态文件（status.json 取本地最新，其余按语义合并后结果）
          for f in $STATE_FILES; do
            [ -f "$TMPD/$f" ] && cp "$TMPD/$f" .
          done
          # kuaishou_guest_visitor.json 特殊处理：游客 did 需跨运行稳定复用，绝不能回退成 null。
          # 上面的通用恢复会盲目把 TMPD 版本拷回；若本轮是并发失败轮（只拿到种子 null），会把已提交的
          # 好 did 覆盖成 null，导致跨运行复用失效。这里仅当 TMPD 含有效 did（"web_" 开头）才采用，
          # 否则回退到已提交版本（保留历史好 did）。
          if [ -f "$TMPD/kuaishou_guest_visitor.json" ] && grep -q '"did"[[:space:]]*:[[:space:]]*"web_' "$TMPD/kuaishou_guest_visitor.json" 2>/dev/null; then
            cp "$TMPD/kuaishou_guest_visitor.json" kuaishou_guest_visitor.json
          else
            git show origin/master:kuaishou_guest_visitor.json > kuaishou_guest_visitor.json 2>/dev/null || true
          fi
          [ -d "$TMPD/covers" ] && mkdir -p assets/covers && cp -r "$TMPD/covers/"* assets/covers/ 2>/dev/null || true
          rm -rf "$TMPD"
          # 状态文件被 .gitignore 忽略，用 -f 强制纳入版本控制；notify_dedup.json 为去重账本，同样需持久化
          # status.json 由脚本每轮重写（含 updated/time 等易变时间戳）。前端新鲜度由 Pages 每次部署时从
          # 工作区拷贝最新 status.json 保证（见 Build Pages 步骤），故 git 提交只在「meaningful 内容变化」时
          # 纳入 status.json，忽略纯时间戳变动，避免每 5 分钟空推一条 commit。
          # 状态文件被 .gitignore 忽略，用 -f 强制纳入；assets/covers 用 `git add -A` 以同时 stage 封面删除（孤儿清理），
          # 区别于 `git add -f`（不会 stage 删除，会导致已删封面残留在仓库）。
          git add -f $PERSIST_FILES && git add -A assets/covers
          # status.json：仅当其 meaningful 内容（去掉 updated 与每房间 time/live_duration）相比 HEAD 变化才提交
          # 内联 heredoc（python3 - <<'PY'）会被 GitHub Actions 的 js-yaml 误判合并键而解析失败，
          # 故抽取为独立脚本 tools/strip_status.py（与 96802b1 的「消除重复推送」同目标）。
          python3 tools/strip_status.py
          # 防刷屏：仅当状态文件真有变化才提交；否则跳过 push，避免每 5 分钟空推一条 commit。
          # 保活（防 60 天自动停用 schedule）改为：距上次 keepalive 超过 30 天才更新时间戳并轻量提交一次。
          if git diff --cached --quiet; then
            echo "状态无变化，跳过提交"
            # 仅当超过 30 天未保活时才更新 .keepalive 时间戳（轻量保活，不刷屏）
            NEED_KEEPALIVE=false
            if [ -f .keepalive ]; then
              LAST=$(python3 -c "
          from datetime import datetime, timezone
          import sys
          try:
              dt = datetime.fromisoformat(sys.argv[1].replace('Z','+00:00'))
              print(int(dt.timestamp()))
          except Exception:
              print(0)
          " "$(cat .keepalive)" 2>/dev/null || echo 0)
              NOW=$(date -u +%s)
              if [ "$LAST" != "0" ] && [ $((NOW - LAST)) -gt 2592000 ]; then NEED_KEEPALIVE=true; fi
            else
              NEED_KEEPALIVE=true
            fi
            if [ "$NEED_KEEPALIVE" = "true" ]; then
              date -u +"%Y-%m-%dT%H:%M:%SZ" > .keepalive
              git add .keepalive
              git commit -m "📡 keepalive [skip ci]" || true
              for i in 1 2; do
                git push origin HEAD:master 2>&1 && break
                git fetch origin master 2>&1 || true
                git reset --hard origin/master 2>/dev/null || true
                date -u +"%Y-%m-%dT%H:%M:%SZ" > .keepalive
                git add .keepalive
                git commit -m "📡 keepalive [skip ci]" || true
              done || echo "keepalive push failed"
            fi
          else
            # 每次运行更新时间戳，保证仓库持续有活动（防 60 天自动停用 schedule）
            date -u +"%Y-%m-%dT%H:%M:%SZ" > .keepalive
            git add .keepalive
            git commit -m "📡 update state [skip ci]" || true
          fi
          # 推送：基于远端 master 提交，应为快进。若失败（远端又推进了），重试
          for i in 1 2; do
            git push origin HEAD:master 2>&1 && break
            echo "push 失败，重试 ($i)... 重新 fetch + 合并"
            git fetch origin master 2>&1 || true
            python3 merge_state.py origin/master
            TMPD=$(mktemp -d)
            for f in $STATE_FILES; do
              [ -f "$f" ] && cp "$f" "$TMPD/"
            done
            [ -d assets/covers ] && cp -r assets/covers "$TMPD/covers"
            git reset --hard origin/master 2>/dev/null || true
            for f in $STATE_FILES; do
              [ -f "$TMPD/$f" ] && cp "$TMPD/$f" .
            done
            [ -d "$TMPD/covers" ] && mkdir -p assets/covers && cp -r "$TMPD/covers/"* assets/covers/ 2>/dev/null || true
            rm -rf "$TMPD"
            # 状态文件被 .gitignore 忽略，用 -f 强制纳入；assets/covers 用 `git add -A` 以同时 stage 封面删除（孤儿清理），
          # 区别于 `git add -f`（不会 stage 删除，会导致已删封面残留在仓库）。
          git add -f $PERSIST_FILES && git add -A assets/covers
            python3 tools/strip_status.py
            # 重试也仅在状态真变时才提交，避免为无变化空推
            if git diff --cached --quiet; then echo "重试：状态无变化，跳过"; break; fi
            date -u +"%Y-%m-%dT%H:%M:%SZ" > .keepalive
            git add .keepalive
            git commit -m "📡 update state [skip ci]" || true
          done || echo "push failed (状态将在下一次 run 自动对齐，去重账本兜底防刷屏)"

      # 上传运行时日志便于排障（logs/ 默认被 .gitignore 忽略，仅作 artifact 留存，不影响监控/部署）
      - name: Upload runtime logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-logs
          path: logs/
          if-no-files-found: ignore

      # 构建 Pages 目录（同域名部署；状态已提交 Git 作可靠后备）
      - name: Build Pages
        run: |
          mkdir -p _site
          cp monitor.html _site/
          cp libsodium.js _site/ 2>/dev/null || true
          cp index.html _site/ 2>/dev/null || true
          cp rooms.json _site/
          cp status.json _site/
          cp history.json _site/
          cp post_rooms.json _site/
          cp post_tracking.json _site/

      # 前端版本号：部署时用当前 commit 短 SHA + UTC 时间烙进页面（monitor.html 右下角角标 / index.html 页脚）。
      # 同时把 index.html 跳转 monitor.html 的缓存戳 ?v= 替换为 SHA，确保每次部署都强刷 monitor.html，
      # 用户刷新即可确认「最新推送是否已上线」。无需手动 bump。
      - name: Stamp frontend version
        run: |
          VER="$(git rev-parse --short HEAD)"
          BUILD="$(date -u +'%Y-%m-%d %H:%M UTC')"
          python3 -c "
          import sys
          ver, build = sys.argv[1], sys.argv[2]
          for f in ['_site/monitor.html', '_site/index.html']:
              try:
                  s = open(f).read()
                  s = s.replace('__APP_VERSION__', f'{ver} · {build}').replace('__APP_CACHE_BUST__', ver)
                  open(f, 'w').write(s)
              except FileNotFoundError:
                  pass
          " "$VER" "$BUILD"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3

  # 独立测试任务：运行 pytest 回归套件（不影响监控/部署，仅作质量信号）
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test deps
        run: |
          python -m pip install --upgrade pip
          # 测试作业需同时安装运行时依赖（requirements.txt 含 fastapi/sqlalchemy 等，
          # phase4 与 detection_wiring 测试需要），仅装 requirements-dev.txt 会因缺模块 ImportError。
          pip install -r requirements.txt -r requirements-dev.txt
          pip install pytest-cov

      - name: Run pytest
        run: python -m pytest -q

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: htmlcov/
          retention-days: 7

  deploy:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
